<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta name="referrer" content="no-referrer">
    <meta charset="UTF-8">
    <title>🐔</title>
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://chicktv.github.io/tv/flv.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0d0d0d;
            display: flex; flex-direction: column; height: 98vh;
            color: #eee; font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: clamp(12px, 1vw, 16px); overflow-x: hidden;
        }
        #top-bar {
            position: relative; border-bottom: 1px solid #333;
            padding: 0.75em 1.25em; background: rgba(15, 15, 15, 0.98);
            display: flex; flex-wrap: nowrap; align-items: center;
            justify-content: space-between; overflow: hidden;
            min-height: 60px; z-index: 100; contain: layout paint;
        }
        .top-container {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; flex-wrap: nowrap; gap: 0.625em;
        }
        #lists {
            display: flex; flex-wrap: nowrap; gap: 0.5em; align-items: center;
            overflow-x: auto; overflow-y: hidden; white-space: nowrap;
            flex: 1; min-width: 0; padding: 0.3125em 0 0.625em 0;
            -ms-overflow-style: auto; scrollbar-width: auto; cursor: grab;
        }
        #lists:active { cursor: grabbing; }
        #lists::-webkit-scrollbar { height: 8px; background-color: #1f1f2b; border-radius: 10px; }
        #lists::-webkit-scrollbar-track { background: #1a1a24; border-radius: 10px; margin: 0 4px; }
        #lists::-webkit-scrollbar-thumb { background: #4a4a5a; border-radius: 10px; transition: background 0.2s; }
        #lists::-webkit-scrollbar-thumb:hover { background: #6f6f8a; }
        #lists::-webkit-scrollbar-thumb:active { background: #00ff88; }
        @media (max-width: 768px) { #lists { display: none; } }

        .button-wrapper { position: relative; display: inline-flex; flex-shrink: 0; margin-right: 0.3125em; }
        .status-button {
            background: #222; border: 1px solid #444; color: #eee;
            padding: 0.5em 1em; border-radius: 8px;
            transition: background-color 0.15s, border-color 0.15s;
            font-weight: 500; cursor: pointer; white-space: nowrap;
            font-size: clamp(10px, 0.85vw, 14px); min-height: 36px;
            display: flex; align-items: center; justify-content: center; position: relative;
        }
        .status-button:hover { background: #333; }
        .live, .unknown2 {
            color: #00ff88 !important; border: 1px solid #00ff88 !important;
            background: rgba(0, 255, 136, 0.05) !important;
        }
        .not-live { color: #ff3333 !important; border-color: #ff3333 !important; }
        .unknown { color: #FFFFFF !important; border-color: #666 !important; }

        .toggle-switch {
            display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
            user-select: none; background: #222; padding: 4px 12px;
            border-radius: 6px; height: 36px; font-size: 0.85rem; white-space: nowrap;
        }
        .toggle-switch .slider {
            position: relative; display: inline-block; width: 44px; height: 22px;
            background-color: #555; border-radius: 34px; transition: background-color 0.2s;
        }
        .toggle-switch .slider::before {
            content: ""; position: absolute; width: 18px; height: 18px;
            left: 2px; bottom: 2px; background-color: white; border-radius: 50%;
            transition: transform 0.2s;
        }
        .toggle-switch input { display: none; }
        .toggle-switch input:checked + .slider { background-color: #00ff88; }
        .toggle-switch input:checked + .slider::before { transform: translateX(22px); }
        .purple-toggle input:checked + .slider { background-color: #8a2be2; }
        .toggle-label { color: #eee; font-weight: 500; }

        #input-container {
            display: flex; align-items: center; gap: 0.5em; flex-wrap: nowrap;
            overflow: hidden; white-space: nowrap; margin-top: 0;
            flex-shrink: 0; margin-left: auto; padding-left: 0.625em;
        }
        #channel-selection {
            display: none; position: fixed; top: 10px; right: 80px;
            background: #111; padding: 20px; border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8); color: #fff; z-index: 1000;
            border: 1px solid #333; max-height: 80vh; overflow-y: auto; contain: layout paint;
        }
        input, select {
            background: #222; border: 1px solid #444; border-radius: 6px;
            color: lime; padding: 8px 12px; min-width: 80px;
        }
        button {
            background: #2a2a2a; border: 1px solid #444; color: #fff;
            padding: 0.5em 0.875em; border-radius: 6px; cursor: pointer;
            display: inline-flex; align-items: center; gap: 0.375em;
            font-size: clamp(12px, 0.9vw, 14px); height: 36px;
            white-space: nowrap; box-sizing: border-box;
        }
        button:hover { background: #333; }

        #multi-stream-container-wrapper {
            display: flex; gap: 0.9375em; padding: 0.9375em;
            flex-grow: 1; min-height: 70vh; contain: layout;
        }
        .video-wrapper, .chat {
            background: #000; border-radius: 12px; border: 1px solid #333;
            min-height: 400px; contain: layout paint;
        }
        .video-wrapper { flex: 3; padding: 0.9375em; display: flex; flex-direction: column; }
        .chat { flex: 1; }
        iframe, video { contain: layout paint; }
        .video, .video1, .full-screen-video { width: 100%; height: 100%; border: none; }

        .kick-wrapper {
            position: relative; width: 100%; height: 100%;
            overflow: hidden; border-radius: inherit;
        }
        .kick-iframe {
            position: absolute; top: 0; left: 0; width: 220%; height: 220%;
            transform: scale(0.454545); transform-origin: top left;
            border: none; border-radius: inherit;
        }
        .kick-iframe:fullscreen, .kick-iframe:-webkit-full-screen, .kick-iframe:-moz-full-screen {
            width: 100% !important; height: 100% !important; transform: none !important;
        }

        #multi-stream-container {
            display: grid; grid-template-columns: 1fr; grid-template-rows: 1fr;
            gap: 0.625em; height: 100%; width: 100%; overflow: hidden;
        }
        .hls-video-element {
            width: 100%; height: 100%; object-fit: contain;
            background: #000; border-radius: 8px;
        }

        #mobile-menu-btn { display: none; background: #6a35bb; }
        #channel-menu {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a0a; z-index: 1000; padding: 0; overflow: hidden; contain: strict;
        }
        #channel-menu-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.9375em 1.25em; background: #111; border-bottom: 1px solid #333;
            position: sticky; top: 0; z-index: 1001;
        }
        #menu-channel-list {
            display: flex; flex-direction: column; gap: 0.625em;
            padding: 0.9375em 1.25em; height: calc(100% - 4.375em);
            overflow-y: auto; -webkit-overflow-scrolling: touch;
        }
        .menu-status-button {
            width: 100%; text-align: left; padding: 0.75em 0.9375em;
            margin-bottom: 0.3125em; font-size: clamp(13px, 1vw, 15px);
        }
        .status-indicator {
            display: inline-block; width: 10px; height: 10px;
            border-radius: 50%; margin-right: 0.5em;
        }
        .status-live { background-color: #00ff88; }
        .status-not-live { background-color: #ff3333; }
        .status-unknown { background-color: #cccccc; }

        .modal-mask {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); z-index: 2000;
            display: flex; align-items: center; justify-content: center;
            visibility: hidden; opacity: 0;
            transition: visibility 0.1s, opacity 0.1s;
        }
        .modal-mask.active { visibility: visible; opacity: 1; }
        .modal-panel {
            background: #1e1e2a; border-radius: 16px; width: 90%;
            max-width: 560px; padding: 1.8rem 1.5rem;
            border: 1px solid #333; box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        .modal-panel h3 {
            margin-top: 0; margin-bottom: 1.2rem; font-size: 1.5rem;
            display: flex; align-items: center; gap: 8px; color: #00ff88;
            border-left: 4px solid #00ff88; padding-left: 15px;
        }
        .delete-channel-list {
            max-height: 55vh; overflow-y: auto; margin: 1rem 0;
            background: #0f0f17; border-radius: 12px; padding: 0.75rem;
        }
        .channel-item-delete {
            display: flex; align-items: center; padding: 10px 12px;
            margin-bottom: 6px; background: #252530; border-radius: 8px; gap: 12px;
        }
        .channel-item-delete input {
            width: 20px; height: 20px; cursor: pointer; accent-color: #00ff88; flex-shrink: 0;
        }
        .channel-info { flex: 1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .del-status-bullet { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .del-channel-name { font-weight: 500; font-size: 0.95rem; }
        .del-channel-meta {
            font-size: 0.7rem; color: #aaa; background: #1a1a24;
            padding: 2px 8px; border-radius: 20px;
        }
        .form-group { margin-bottom: 1.2rem; }
        .modal-buttons { display: flex; gap: 12px; margin-top: 16px; }
        .modal-buttons button {
            flex: 1; justify-content: center; height: 44px;
            font-weight: bold; font-size: 1rem;
        }
        .btn-confirm { background: #b91c1c; border: none; }
        .btn-confirm:hover { background: #dc2626; }
        .btn-cancel { background: #3a3a44; border: 1px solid #555; }
        .select-all-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 0 12px 0; border-bottom: 1px solid #3a3a44; margin-bottom: 12px;
        }
        .select-all-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.85rem; }

        @media (max-width: 768px) {
            body { font-size: 14px; }
            #multi-stream-container-wrapper {
                flex-direction: column; padding: 0.625em; gap: 0.625em; flex: 1; min-height: 0;
            }
            .chat { flex: 3; display: flex; flex-direction: column; min-height: 0; }
            .chat iframe#chat_embed { flex: 1; width: 100%; height: 100%; border-radius: inherit; }
            .video-wrapper { flex: 4; min-height: 0; display: flex; flex-direction: column; }
            #multi-stream-container { flex: 1; min-height: 0; }
            #input-container {
                flex-wrap: nowrap; overflow-x: auto; padding-bottom: 0.3125em;
                margin-top: 0; width: 100%; justify-content: flex-start;
            }
            #lists { display: none; }
            #mobile-menu-btn { display: inline-flex; }
            .top-container { flex-direction: column; align-items: stretch; gap: 0.5em; }
            #top-bar { padding: 0.5em; min-height: auto; }
            .modal-panel { padding: 1rem; width: 95%; }
            .delete-channel-list { max-height: 50vh; }
        }
        @media (min-width: 769px) {
            #mobile-menu-btn { display: none !important; }
            #lists { display: flex; }
        }
    </style>
</head>
<body>
    <div id="top-bar">
        <div class="top-container">
            <div id="lists"></div>
            <div id="input-container">
                <button id="mobile-menu-btn" onclick="toggleChannelMenu()">☰ 頻道</button>
                <label class="toggle-switch" id="hideNotLiveToggle">
                    <input type="checkbox" id="toggleNotLive">
                    <span class="slider"></span>
                    <span class="toggle-label">隱藏離線</span>
                </label>
                <button onclick="showPopup()">🐓掛台</button>
                <button id="addChannelBtn">➕ 加台</button>
                <button id="delChannelBtn">🗑 del台</button>
                <button id="more-channels-btn" onclick="toggleChannelSelection()">📺 看更台</button>
                <label class="toggle-switch purple-toggle" id="chatToggleWrapper">
                    <span class="toggle-label" id="chatToggleLabel">TWITCH</span>
                    <input type="checkbox" id="chatToggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <div id="addChannelModal" class="modal-mask">
        <div class="modal-panel">
            <h3>✨ 新增頻道(只有自己睇到 想人人睇到請用掛台功能)</h3>
            <div class="form-group">
                <label>頻道名稱</label>
                <input type="text" id="modal-channel-name" placeholder="例: BeamStream頻道" autocomplete="off">
            </div>
            <div class="form-group">
                <label>頻道ID / 影片ID / M3U8網址 / 完整Embed網址</label>
                <input type="text" id="modal-channel-id" placeholder="" autocomplete="off">
            </div>
            <div class="form-group">
                <label>平台</label>
                <select id="modal-channel-platform"></select>
            </div>
            <div class="modal-buttons">
                <button class="btn-confirm" id="confirmAddChannel" style="background: #00b359;">➕ 確認加台</button>
                <button class="btn-cancel" id="cancelAddChannel">取消</button>
            </div>
        </div>
    </div>

    <div id="deleteChannelModal" class="modal-mask">
        <div class="modal-panel">
            <h3>🗑 刪除頻道 (可複選)</h3>
            <div class="select-all-bar">
                <label class="select-all-label">
                    <input type="checkbox" id="deleteSelectAll"> 全選 / 全不選
                </label>
                <span style="font-size:0.75rem; color:#aaa;">✔️ 勾選後確認將被移除</span>
            </div>
            <div id="deleteChannelListContainer" class="delete-channel-list">
                <div style="color:#aaa; text-align:center; padding:20px;">載入頻道中...</div>
            </div>
            <div class="modal-buttons">
                <button class="btn-confirm" id="confirmDeleteChannels">✔️ 確認刪除</button>
                <button class="btn-cancel" id="cancelDeleteModal">取消</button>
            </div>
        </div>
    </div>

    <div id="channel-selection" style="display: none;">
        <h3>📡 選擇要同時觀看的台：</h3>
        <div id="channel-options"></div>
        <button onclick="watchSelectedChannels()">▶️ 開始觀看</button>
        <button onclick="checkAllLiveChannels()" style="background: #00ff88; color: #0d0d0d; font-weight: bold; border: none; padding: 4px 12px; font-size: 0.85rem;">所有在線頻道</button>
        <button onclick="clearAllChannelSelection()" style="background: #333; color: #ccc; border: 1px solid #444; padding: 4px 12px; font-size: 0.85rem;">全選</button>
    </div>

    <div id="multi-stream-container-wrapper">
        <div id="multi-stream-container" class="video-wrapper">
            <iframe id="MyFrame" class="video1" src="https://ok.ru/videoembed/10268974521971?nochat=1&autoplay=1" frameborder="0" allowfullscreen></iframe>
        </div>
        <iframe class="chat" id="chat_embed" src="https://chicktv.github.io/tv/dark.html" allowfullscreen="true" scrolling="yes"></iframe>
    </div>

    <div id="channel-menu" style="display: none;">
        <div id="channel-menu-header">
            <h3 style="margin: 0; font-size: 1.2rem;">頻道列表 (共 <span id="channel-count">0</span> 個頻道)</h3>
            <button onclick="toggleChannelMenu()" style="background: #b91c1c; padding: 8px 15px; font-size: 0.9rem; border:none;">✕ 關閉</button>
        </div>
        <div id="menu-channel-list"></div>
    </div>

<script>
/* =====================================================================================
   ★★★  平台註冊表 (PLATFORM REGISTRY)  ★★★
   -------------------------------------------------------------------------------------
   想新增一個平台？只需要在下面 PLATFORMS 加一個 key 就好，其他程式都不用改。

   每個平台可以填的欄位：
     label          選單上顯示的名稱
     icon           按鈕前面的小圖示
     type           播放器型別，可選：
                      'iframe'       → 一般 iframe (buildUrl 回傳網址)
                      'scaledIframe' → Kick 那種「欺騙大播放器」的縮放 iframe
                      'hls'          → 用 hls.js 播 .m3u8 (id 直接當網址)
                      'flv'          → 用 flv.js 播 .flv   (buildUrl 回傳網址)
     buildUrl(ch, muted) → 回傳播放網址 (iframe / flv 需要)
     allow          iframe 的 allow 屬性 (可選)
     referrerPolicy iframe 的 referrerpolicy (可選)
     aliases        API 回傳的舊平台名稱，例如 ['vl'] 會被對應到 kick
     status(ch)     async 函式，回傳 'live' | 'not-live' | 'unknown' | 'unknown2'
                    ('unknown2' 表示「有開台但無法偵測」→ 亮綠燈)
     idPlaceholder  加台視窗中「頻道ID」欄位的提示文字

   新增範例：
     myplatform: {
         label: 'MyPlatform',
         icon: 'Ⓜ',
         type: 'iframe',
         buildUrl: (ch, muted) => `https://myplatform.com/embed/${ch.id}?mute=${muted ? 1 : 0}`,
         status: async (ch) => {
             const r = await fetch(`https://api.myplatform.com/${ch.id}`);
             const d = await r.json();
             return d.live ? 'live' : 'not-live';
         },
         idPlaceholder: 'MyPlatform 頻道 ID'
     }
   ===================================================================================== */

const PLATFORMS = {
    twitch: {
        label: 'Twitch',
        icon: 'Ⓣ',
        type: 'iframe',
        buildUrl: (ch, muted) =>
            `https://player.twitch.tv/?channel=${ch.id}&parent=${encodeURIComponent(parent)}&muted=${muted}`,
        status: async (ch) => {
            const resp = await fetch(`https://api.twitch.tv/helix/streams?user_login=${ch.id}`, {
                headers: { "Authorization": `Bearer ${TWITCH_TOKEN}`, "Client-Id": TWITCH_CLIENT_ID }
            });
            const data = await resp.json();
            return (data.data && data.data.length > 0) ? 'live' : 'not-live';
        },
        idPlaceholder: 'Twitch 頻道名稱 (英文小寫)'
    },

    kick: {
        label: 'Kick',
        icon: 'Ⓚ',
        type: 'scaledIframe',
        buildUrl: (ch, muted) => `https://player.kick.com/${ch.id}?muted=${muted}&autoplay=true`,
        aliases: ['vl'],
        status: async (ch) => {
            const resp = await fetch(`https://kick.com/api/v2/channels/${ch.id}`);
            const data = await resp.json();
            return (data.livestream && data.livestream.is_live === true) ? 'live' : 'not-live';
        },
        idPlaceholder: 'Kick 頻道名稱 (例: xqc)'
    },

    ok: {
        label: 'OK.ru',
        icon: 'ⓞ',
        type: 'iframe',
        buildUrl: (ch, muted) =>
            `https://ok.ru/videoembed/${ch.id}?nochat=1&autoplay=1${muted ? '&muted=1' : ''}`,
        aliases: ['okru'],
        status: async (ch) => {
            const resp = await fetch(`https://young-cloud-e59f.chicktv001.workers.dev/https://ok.ru/videoembed/${ch.id}`);
            const html = await resp.text();
            console.log(`[OK Check Raw Text]`, JSON.stringify(html));
            const upperText = html.toUpperCase();
            const isOkLive = upperText.includes('STATUS:"ONLINE"') ||
                             upperText.includes('"STATUS":"ONLINE"') ||
                             /\bLIVE\b/.test(upperText);
            console.log(`[OK Check Final Result] ${ch.id}:`, isOkLive ? 'live' : 'not-live');
            return isOkLive ? 'live' : 'not-live';
        },
        idPlaceholder: 'OK.ru 影片 ID (例: 10268974521971)'
    },

    at: {
        label: 'AngelThump',
        icon: 'Ⓐ',
        type: 'iframe',
        buildUrl: (ch, muted) =>
            `https://player.angelthump.com/?channel=${ch.id}${muted ? '&muted=true' : ''}`,
        status: async (ch) => {
            const resp = await fetch(`https://api.angelthump.com/v2/streams/${ch.id}`);
            if (!resp.ok) return 'not-live';
            const data = await resp.json();
            return data.type === 'live' ? 'live' : 'not-live';
        },
        idPlaceholder: 'AngelThump 頻道名稱'
    },

    m3u8: {
        label: 'M3U8 (HLS)',
        icon: 'Ⓜ',
        type: 'hls',
        status: async () => 'live',   // 直接當成 live
        idPlaceholder: '完整 .m3u8 網址'
    },

    youtube: {
        label: 'YouTube Live',
        icon: 'ⓨ',
        type: 'iframe',
        allow: "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture",
        referrerPolicy: "strict-origin-when-cross-origin",
        buildUrl: (ch, muted) => {
            const muteVal = muted ? "1" : "0";
            const isChannelId = ch.id.startsWith("UC") || ch.id.startsWith("HC") || ch.id.includes("channel");
            return isChannelId
                ? `https://www.youtube.com/embed/live_stream?channel=${ch.id}&autoplay=1&mute=${muteVal}`
                : `https://www.youtube.com/embed/${ch.id}?autoplay=1&mute=${muteVal}`;
        },
        status: async () => 'unknown2',
        idPlaceholder: 'YouTube 頻道 ID (UC...) 或影片 ID'
    },

    bs: {
        label: 'BeamStream (BS)',
        icon: 'Ⓑ',
        type: 'iframe',
        buildUrl: (ch) => ch.id,   // id 本身就是完整 embed 網址
        status: async (ch) => {
            const resp = await fetch(`https://r.jina.ai/${ch.id}`);
            const text = await resp.text();
            if (text.includes("Channel is offline")) return 'not-live';
            if (text.includes("Live")) return 'live';
            return 'unknown';
        },
        idPlaceholder: 'BeamStream 完整 embed 網址'
    },

    

    vaughn: {
        label: 'Vaughn',
        icon: 'ⓥ',
        type: 'flv',
        buildUrl: (ch, muted) => {
            const originalUrl = `https://stream-cdn-iad3.vaughnsoft.net/play/live_${ch.id}.flv`;
            return `https://cold-frost-3328.chicktv02.workers.dev/?url=${encodeURIComponent(originalUrl)}`;
        },
        status: async (ch) => {
            const resp = await fetch(`https://young-cloud-e59f.chicktv001.workers.dev/?quest=https://api.vaughnsoft.net/v1/stream/vl/${ch.id}`);
            if (!resp.ok) return 'not-live';
            const data = await resp.json();
            return data.live === true ? 'live' : 'not-live';
        },
        idPlaceholder: 'Vaughn 頻道 ID'
    },
	goodgame: {
    label: 'GoodGame',
    icon: 'Ⓖ',
    type: 'iframe',
    buildUrl: (ch, muted) =>
        `https://goodgame.ru/player?${ch.id}${muted ? '&muted=1' : ''}`,
    status: async (ch) => {
        try {
            // ★ 優先用 ggUsername，沒有才退回 ch.id
            const username = ch.ggUsername || ch.id;
            const api = `https://goodgame.ru/api/4/users/${encodeURIComponent(username)}/stream`;
            const resp = await fetch(
                `https://young-cloud-e59f.chicktv001.workers.dev/?quest=${encodeURIComponent(api)}`
            );
            if (!resp.ok) return 'not-live';
            const data = await resp.json();
            if (!data || !data.id) return 'not-live';
            if (data.status === true || data.online === true) return 'live';
            return 'not-live';
        } catch (e) {
            console.warn('[GoodGame status error]', e);
            return 'unknown';
        }
    },
    idPlaceholder: 'GoodGame 頻道名 (例: Pomi)',
    async resolveId(input) {
        const api = `https://goodgame.ru/api/4/users/${encodeURIComponent(input)}/stream`;
        const resp = await fetch(
            `https://young-cloud-e59f.chicktv001.workers.dev/?quest=${encodeURIComponent(api)}`
        );
        if (!resp.ok) throw new Error('無法連接 GoodGame API');
        const data = await resp.json();
        if (!data || !data.id) throw new Error('找不到該頻道');
        return {
            id: String(data.id),
            ggUsername: data.channelkey || data.streamkey || input
        };
    }
}
};

/* -------------------------------------------------------------------------------------
   播放器渲染器 (依 type 分派) —— 一般情況下不需要改這裡
   ------------------------------------------------------------------------------------- */
const RENDERERS = {
    iframe(channel, p, muted, wrapperClass) {
        const iframe = document.createElement('iframe');
        iframe.className = wrapperClass;
        iframe.src = p.buildUrl(channel, muted);
        iframe.allowFullscreen = true;
        iframe.loading = 'lazy';
        iframe.allow = p.allow || "autoplay; fullscreen; encrypted-media";
        if (p.referrerPolicy) iframe.referrerPolicy = p.referrerPolicy;
        return iframe;
    },

    scaledIframe(channel, p, muted, wrapperClass) {
        const wrapper = document.createElement('div');
        wrapper.className = `${wrapperClass} kick-wrapper`;
        const iframe = document.createElement('iframe');
        iframe.className = 'kick-iframe';
        iframe.src = p.buildUrl(channel, muted);
        iframe.allowFullscreen = true;
        iframe.loading = 'lazy';
        iframe.allow = p.allow || "autoplay; fullscreen; encrypted-media";
        wrapper.appendChild(iframe);
        return wrapper;
    },

    hls(channel, p, muted, wrapperClass) {
        const video = document.createElement('video');
        video.className = `hls-video-element ${wrapperClass}`;
        video.controls = true;
        video.autoplay = true;
        video.muted = muted;
        video.playsInline = true;
        if (Hls.isSupported()) {
            const hls = new Hls(HLS_CONFIG);
            hls.loadSource(channel.id);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
            currentHLSInstances.push(hls);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = channel.id;
        } else {
            return buildErrorDiv('⚠️ 瀏覽器不支援 HLS');
        }
        return video;
    },

    flv(channel, p, muted, wrapperClass) {
        if (!(typeof flvjs !== 'undefined' && flvjs.isSupported())) {
            return buildErrorDiv('⚠️ 瀏覽器不支援 FLV.js，無法播放 .flv 格式');
        }
        const video = document.createElement('video');
        video.className = `hls-video-element ${wrapperClass}`;
        video.controls = true;
        video.autoplay = true;
        video.muted = muted;
        video.playsInline = true;
        const flvPlayer = flvjs.createPlayer({
            type: 'flv',
            url: p.buildUrl(channel, muted),
            isLive: true,
            cors: true
        });
        flvPlayer.attachMediaElement(video);
        flvPlayer.load();
        flvPlayer.play().catch(() => {});
        currentFLVInstances.push(flvPlayer);
        return video;
    }
};

function buildErrorDiv(msg) {
    const d = document.createElement('div');
    d.style.cssText = 'color:red;display:flex;align-items:center;justify-content:center;width:100%;height:100%;';
    d.textContent = msg;
    return d;
}

    enableWorker: true,
    capLevelToPlayerSize: true,
    maxBufferLength: 15,
    maxMaxBufferLength: 30
};

/* ======================== 平台工具函式 ======================== */
function getPlatform(key) {
    if (!key) return null;
    return PLATFORMS[String(key).toLowerCase()] || null;
}

function platformIcon(key) {
    const p = getPlatform(key);
    return p ? p.icon : '📺';
}

function platformLabel(key) {
    const p = getPlatform(key);
    return p ? p.label : (key || '未知');
}

/** 把 API 回傳的舊平台名稱轉成註冊表 key */
function resolvePlatform(raw) {
    if (!raw) return null;
    const lower = String(raw).toLowerCase();
    if (PLATFORMS[lower]) return lower;
    for (const [key, p] of Object.entries(PLATFORMS)) {
        if (p.aliases && p.aliases.includes(lower)) return key;
    }
    return null;
}

/* ------------------------ 核心播放銷毀 ------------------------ */
function destroyAllHLSInstances() {
    if (currentHLSInstances.length) {
        currentHLSInstances.forEach(instance => {
            if (instance && typeof instance.destroy === 'function') instance.destroy();
        });
        currentHLSInstances = [];
    }
    if (currentFLVInstances.length) {
        currentFLVInstances.forEach(instance => {
            if (instance) {
                try {
                    instance.pause();
                    instance.unload();
                    instance.detachMediaElement();
                    instance.destroy();
                } catch (e) { console.warn(e); }
            }
        });
        currentFLVInstances = [];
    }
}

/** 建立單一頻道的播放元素 (統一入口) */
function renderChannelElement(channel, muted, wrapperClass) {
    const p = getPlatform(channel.platform);
    if (!p) return buildErrorDiv(`⚠️ 未知平台: ${channel.platform}`);
    const renderer = RENDERERS[p.type] || RENDERERS.iframe;
    return renderer(channel, p, muted, wrapperClass);
}

/* ------------------------ 單台觀看 ------------------------ */
function displaySingleChannel(channel) {
    const container = document.getElementById("multi-stream-container");
    if (!container) return;
    destroyAllHLSInstances();
    container.innerHTML = "";
    container.style.gridTemplateColumns = "1fr";
    container.style.gridTemplateRows = "1fr";

    if (!channel) {
        container.innerHTML = `<div style="color:#aaa; text-align:center; padding:2rem;">未選擇頻道</div>`;
        currentDisplayChannel = null;
        return;
    }
    currentDisplayChannel = channel;

/* ------------------------ 多台觀看 ------------------------ */
function watchSelectedChannels() {
    const selectionDiv = document.getElementById("channel-selection");
    if (selectionDiv) selectionDiv.style.display = "none";
    const container = document.getElementById("multi-stream-container");
    if (!container) return;
    destroyAllHLSInstances();
    container.innerHTML = "";

    const checkboxes = document.querySelectorAll("#channel-options input:checked");
    const selected = Array.from(checkboxes).map(cb => ({
        id: cb.value, platform: cb.dataset.platform, name: cb.dataset.name || ""
    }));
    const fullSelected = selected
        .map(sel => channels.find(ch => ch.id === sel.id && ch.platform === sel.platform))
        .filter(Boolean);

    if (fullSelected.length === 0) {
        container.innerHTML = `<div style="color:#aaa; text-align:center; padding:2rem;">未選擇任何頻道</div>`;
        return;
    }

    const isMuted = fullSelected.length > 1;
    const isOnlyOne = fullSelected.length === 1;
    const count = fullSelected.length;
    const cols = Math.ceil(Math.sqrt(count));
    const rows = Math.ceil(count / cols);
    container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    container.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

    const frag = document.createDocumentFragment();
    fullSelected.forEach(ch => {
        const wrapperClass = isOnlyOne ? "full-screen-video" : "video";
        frag.appendChild(renderChannelElement(ch, isMuted, wrapperClass));
    });
    container.appendChild(frag);
}

async function loadChannelsFromUrl() {
    let txtChannels = [], apiChannelsTemp = [];

    try {
        const resp = await fetch('https://chicktv.github.io/tv/ch1.txt');
        if (resp.ok) {
            const data = await resp.text();
            txtChannels = data.split('\n').filter(l => l.trim()).map(line => {
                const parts = line.split(',').map(p => p.trim());
               if (parts.length === 3) {
    return { name: parts[0], id: parts[1], platform: parts[2].toLowerCase(), _fromTxt: true };
}
if (parts.length >= 4) {
    return {
        name: parts[0],
        id: parts[1],
        platform: parts[2].toLowerCase(),
        ggUsername: parts[3] || undefined,   // ★ GoodGame 頻道名
        _fromTxt: true
    };
}
return null;
            }).filter(Boolean);
        }
    } catch (e) {}

    try {
        const resp = await fetch('https://young-cloud-e59f.chicktv001.workers.dev/?quest=https://live.sk-knower.com/skgamerversion_api.php?page=whitewing918');
        const data = await resp.json();
        if (data.channels) {
            apiChannelsTemp = data.channels.map(item => {
                const platform = resolvePlatform(item.platform);
                if (!platform) return null;
                return {
                    name: (item.displayname || item.details || "Unknown").trim(),
                    id: String(item.details).trim(),
                    platform,
                    _fromAPI: true
                };
            }).filter(Boolean);
        }
    } catch (e) {}

    const stored = JSON.parse(localStorage.getItem("customChannels1") || "[]");
    let allRaw = [...apiChannelsTemp, ...txtChannels, ...stored];

    const seen = new Map();
    for (const ch of allRaw) {
        const key = `${(ch.name || "").trim().toLowerCase()}|${(ch.platform || "").toLowerCase()}`;
        if (!seen.has(key)) seen.set(key, ch);
        else if (ch._fromAPI && !seen.get(key)._fromAPI) seen.set(key, ch);
    }

/* ******* 直播狀態查詢 (統一走平台註冊表) ******* */
async function fetchStatus(channel) {
    if (!channel || !channel.id) return;
    const statusKey = `${channel.platform}_${channel.id}`;
    const p = getPlatform(channel.platform);
    if (!p) return;

    let status = 'unknown';
    try {
        status = p.status ? await p.status(channel) : 'unknown';
        if (!['live', 'not-live', 'unknown', 'unknown2'].includes(status)) status = 'unknown';
    } catch (e) {
        console.warn(`[status error] ${channel.platform}/${channel.id}`, e);
        status = 'unknown';
    }
    channelStatuses[statusKey] = status;
    updateUIForChannel(channel);
}

function fetchAllStatuses() {
    if (TWITCH_TOKEN && TWITCH_CLIENT_ID) channels.forEach(ch => fetchStatus(ch));
}

        };

function escapeHtml(str) {
    return String(str).replace(/[&<>]/g, function (m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function confirmDeleteChannels() {
    const selected = document.querySelectorAll('#deleteChannelListContainer .delete-channel-cb:checked');
    if (selected.length === 0) { alert("⚠️ 請至少選擇一個要刪除的頻道"); return; }
    const toDelete = [];
    selected.forEach(cb => {
        toDelete.push({ name: cb.dataset.name, id: cb.dataset.id, platform: cb.dataset.platform });
    });
    const newChannels = channels.filter(ch =>
        !toDelete.some(del => del.name === ch.name && del.id === ch.id && del.platform === ch.platform)
    );
    if (newChannels.length === channels.length) return;
    channels = newChannels;
    saveChannelsToStorage();
    generateButtons();

    if (currentDisplayChannel && !channels.some(ch => ch.id === currentDisplayChannel.id && ch.platform === currentDisplayChannel.platform)) {
        displaySingleChannel(null);
    }
    const selectionDiv = document.getElementById("channel-selection");
    if (selectionDiv && selectionDiv.style.display !== "none") generateChannelOptions();
    if (document.getElementById('channel-menu').style.display === 'block') {
        toggleChannelMenu();
        setTimeout(() => toggleChannelMenu(), 100);
    }
    fetchAllStatuses();
    closeDeleteModal();
}

document.getElementById('addChannelBtn').onclick = () =>
    document.getElementById('addChannelModal').classList.add('active');

document.getElementById('confirmAddChannel').onclick = async () => {
    const name = document.getElementById('modal-channel-name').value.trim();
    let id = document.getElementById('modal-channel-id').value.trim();
    const platform = document.getElementById('modal-channel-platform').value.toLowerCase();

    if (!name || !id) return alert("請完整填寫名稱及ID");

    const p = getPlatform(platform);
    if (!p) return alert("⚠️ 未知的平台類型");

    // 若平台有提供 resolveId，就先解析成真正的 ID
    let extra = {};
    if (typeof p.resolveId === 'function') {
        try {
            const resolved = await p.resolveId(id);
            id = resolved.id;
            extra = resolved;
        } catch (e) {
            return alert('⚠️ ' + e.message);
        }
    }

    channels.push({ name, id, platform, ...extra });
    saveChannelsToStorage();
    generateButtons();
    document.getElementById('addChannelModal').classList.remove('active');
    fetchAllStatuses();
};
document.getElementById('cancelAddChannel').onclick = () =>
    document.getElementById('addChannelModal').classList.remove('active');
document.getElementById('addChannelModal').addEventListener('click', (e) => {
    if (e.target.classList.contains('modal-mask')) document.getElementById('addChannelModal').classList.remove('active');
});

document.getElementById('delChannelBtn').onclick = openDeleteModal;
document.getElementById('confirmDeleteChannels').onclick = confirmDeleteChannels;
document.getElementById('cancelDeleteModal').onclick = closeDeleteModal;
document.getElementById('deleteChannelModal')?.addEventListener('click', (e) => {
    if (e.target.classList.contains('modal-mask')) closeDeleteModal();
});

/* ======================== 啟動 ======================== */
document.addEventListener('DOMContentLoaded', async () => {
    buildPlatformOptions();
    await loadTwitchCredentials();
    await loadChannelsFromUrl();
    setInterval(fetchAllStatuses, 300000);
});
</script>
</body>
</html>
